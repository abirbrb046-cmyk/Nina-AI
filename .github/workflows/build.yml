name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libtinfo5 libsqlite3-dev gawk libffi-dev python3-dev cmake libstdc++6

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/^requirements =.*/requirements = python3, kivy, requests, gtts/' buildozer.spec
        sed -i 's/^#\s*android.permissions =.*/android.permissions = INTERNET, RECORD_AUDIO/' buildozer.spec
        sed -i 's/^#\s*android.archs =.*/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/^#\s*icon.filename =.*/icon.filename = %(source.dir)s\/icon.ico/' buildozer.spec
        sed -i 's/^#\s*android.build_tools_version =.*/android.build_tools_version = 33.0.2/' buildozer.spec
        sed -i 's/^#\s*android.api =.*/android.api = 33/' buildozer.spec
        buildozer -v android debug action=accept-sdk-license

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nina-APK
        path: bin/*.apk
